services:
  web:
    image: ghcr.io/ibb-official/ibb-school-map:latest
    container_name: ibb-school-map-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAP_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - ibb-school-map-net
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  ibb-school-map-net:
    name: ibb-school-map_default
    ipam:
      config:
        - subnet: 172.20.2.0/24
          gateway: 172.20.2.1
